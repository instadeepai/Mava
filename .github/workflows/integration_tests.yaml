name: Integration Tests 🧪

on:
  push
    # TODO: add this back - just for testing with act
    # branches:
    #   - develop

jobs:
  integration-tests:
    name: "Python ${{ matrix.python-version }} on ubuntu-latest"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.12", "3.11"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout mava
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"  # invalidate cache when requirements file changes

      - uses: actions/setup-python@v5
        with:
            python-version: "${{ matrix.python-version }}"

      - name: Install python dependencies 🔧
        run: uv sync --locked --no-dev  # don't install linters/type checkers

      - name: Run integration tests 🧪
        run: uv run pytest test/integration_test.py -p no:warnings
