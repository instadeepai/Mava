[build-system]
requires = ["setuptools>=62.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ['mava*']

[project]
name = "id-mava"
authors = [{ name = "InstaDeep Ltd" }]
dynamic = ["version"]
license = { file = "LICENSE" }
description = "Distributed Multi-Agent Reinforcement Learning in JAX."
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = [
  "multi-agent",
  "reinforcement learning",
  "python",
  "jax",
  "anakin",
  "sebulba",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "colorama",
  "distrax",
  "flashbax~=0.1.0",
  "flax>=0.8.1",
  "gymnasium==1.0.0",
  "hydra-core==1.3.2",
  "jax",
  "jaxlib",
  "jumanji>= 1.1.0",
  "numpy>=2.0",
  "omegaconf",
  "optax",
  "pandas>=2.3.3",
  "protobuf~=3.20",
  "requests>=2.33.1",
  "scipy",
  "setuptools",
  "tensorboard_logger",
  "tensorflow_probability",
]

[dependency-groups]
dev = ["mypy", "pre-commit", "pytest"]

[tool.setuptools.dynamic]
version = { attr = "mava.__version__" }

[project.urls]
"Homepage" = "https://github.com/instadeep/Mava"
"Bug Tracker" = "https://github.com/instadeep/Mava/issues"

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
disallow_untyped_defs = true
strict_equality = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "W", "RUF", "ANN"]
ignore = [
  "E731",   # Allow lambdas to be assigned to variables.
  "ANN101", # no need to type self
  "ANN102", # no need to type cls
  "ANN204", # no need for return type for special methods
  "ANN401", # can use Any type
]

[tool.ruff.lint.pep8-naming]
ignore-names = ["?"]
